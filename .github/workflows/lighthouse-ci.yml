name: Lighthouse CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app for Lighthouse (relative asset paths)
        run: PUBLIC_URL=. npm run build

      - name: Run Lighthouse CI (temporary public dashboard URL)
        run: |
          npx @lhci/cli@0.13.x autorun \
            --collect.staticDistDir=build \
            --collect.numberOfRuns=3 \
            --collect.settings.chromeFlags="--headless=new --no-sandbox --disable-dev-shm-usage" \
            --upload.target=temporary-public-storage

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci
          if-no-files-found: ignore
